<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tickets – TicketPilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/navbar.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon" style="background:transparent;width:28px;height:28px;padding:0;">
        <svg width="28" height="28" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="34" height="34" rx="9" fill="#1D9E75"/><path d="M23.5 10.5L10.5 16.5L16.5 19.5L19.5 25.5L23.5 10.5Z" fill="white"/><path d="M16.5 19.5L23.5 10.5" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
      <span class="sidebar-brand-name">TicketPilot</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Main</span>
      <a href="user-dashboard.html" class="nav-item"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>Dashboard</a>
      <a href="create-ticket.html" class="nav-item"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 7v6M7 10h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Create Ticket</a>
      <a href="my-tickets.html" class="nav-item active"><svg viewBox="0 0 20 20" fill="none"><path d="M4 5h12M4 10h12M4 15h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>My Tickets <span class="nav-badge" id="nav-tickets-badge">0</span></a>
      <span class="nav-section-label">Account</span>
      <a href="profile.html" class="nav-item"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Profile</a>
      <a href="settings.html" class="nav-item"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="avatar">??</div><div class="sidebar-user-info"><div class="sidebar-user-name">Loading…</div><div class="sidebar-user-role">Customer</div></div></div>
      <a href="#" style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:.78rem;padding:7px 10px;border-radius:var(--radius);margin-top:4px;text-decoration:none;transition:var(--transition);" onmouseover="this.style.background='var(--surface-hover)'" onmouseout="this.style.background='none'" onclick="window.logout(); return false;">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none"><path d="M8 5l-5 5 5 5M3 10h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sign out
      </a>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <a href="user-dashboard.html" style="color:var(--text-muted)">Dashboard</a>
          <span class="breadcrumb-sep">/</span>
          <span class="topbar-title">My Tickets</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-bar">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M15 15l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="search" id="search-input" placeholder="Search tickets…" oninput="filterAll()" />
        </div>
        <a href="create-ticket.html" class="btn btn-primary btn-sm">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          New Ticket
        </a>
        <button class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark/light mode" title="Toggle theme" onclick="window.toggleDarkMode()">
          <span class="icon-sun"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.41 1.41M14.37 14.37l1.41 1.41M4.22 15.78l1.41-1.41M14.37 5.63l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <span class="icon-moon"><svg viewBox="0 0 20 20" fill="none"><path d="M17.5 12A7.5 7.5 0 018 2.5a7.5 7.5 0 100 15 7.5 7.5 0 009.5-5.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
        </button>
        <div class="avatar avatar-sm" onclick="location.href='profile.html'" style="cursor:pointer;" data-user-initials>??</div>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <div class="page-header-left">
          <h2>My Tickets</h2>
          <p>All your submitted support tickets.</p>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar" style="margin-bottom:20px;">
        <select id="filter-status" onchange="filterAll()">
          <option value="">All Status</option>
          <option value="open">Open</option>
          <option value="inprogress">In Progress</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>
        <select id="filter-priority" onchange="filterAll()">
          <option value="">All Priority</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="filter-category" onchange="filterAll()">
          <option value="">All Categories</option>
          <option value="Network">Network</option>
          <option value="Software">Software</option>
          <option value="Hardware">Hardware</option>
          <option value="Account">Account</option>
          <option value="Payment">Payment</option>
          <option value="HR">HR</option>
        </select>
        <button class="btn btn-ghost btn-sm" onclick="resetFilters()">Reset</button>
        <span style="margin-left:auto;color:var(--text-muted);font-size:.82rem;" id="result-count">0 tickets</span>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('id')">Ticket ID ↕</th>
              <th onclick="sortBy('title')">Title ↕</th>
              <th>Category</th>
              <th onclick="sortBy('priority')">Priority ↕</th>
              <th onclick="sortBy('status')">Status ↕</th>
              <th>Department</th>
              <th onclick="sortBy('updated')">Last Updated ↕</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="all-tickets-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Chat widget injected by app.js -->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/sidebar.js"></script>
<script>
let currentTickets = [];
const STATUS_MAP = { open:'Open', inprogress:'In Progress', resolved:'Resolved', closed:'Closed', waiting:'Waiting' };
function cap(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }

function updateNavBadge() {
  const all = currentTickets;
  const open = all.filter(t => !['resolved','closed'].includes(window.getTicketStatusMeta(t).status)).length;
  const badge = document.getElementById('nav-tickets-badge');
  if (badge) badge.textContent = open;
}

let sortField = '', sortAsc = true;
function sortBy(field) { sortField = field; sortAsc = !sortAsc; filterAll(); }

function filterAll() {
  const ALL_TICKETS = currentTickets;
  const status = document.getElementById('filter-status').value;
  const priority = document.getElementById('filter-priority').value;
  const category = document.getElementById('filter-category').value;
  const search = document.getElementById('search-input').value.toLowerCase();

  let filtered = ALL_TICKETS.filter(t => {
    const title = (t.title || t.subject || '').toLowerCase();
    const normalizedStatus = window.normalizeTicketStatus(t.status);
    if (status && normalizedStatus !== status) return false;
    if (priority && (t.priority || '').toLowerCase() !== priority) return false;
    if (category && (t.category || '') !== category) return false;
    if (search && !title.includes(search) && !((t.ticketId || t.id || '').toLowerCase()).includes(search)) return false;
    return true;
  });

  if (sortField) filtered.sort((a,b) => {
    const v = (a[sortField] || '') < (b[sortField] || '') ? -1 : 1;
    return sortAsc ? v : -v;
  });

  render(filtered, ALL_TICKETS.length);
  document.getElementById('result-count').textContent = filtered.length + ' ticket' + (filtered.length !== 1 ? 's' : '');
}

function render(tickets, totalCount) {
  const tbody = document.getElementById('all-tickets-tbody');
  if (!tickets.length) {
    const noData = totalCount === 0;
    tbody.innerHTML = noData
      ? `<tr><td colspan="8"><div class="empty-state" style="padding:48px 20px;text-align:center;">
          <div class="empty-state-icon" style="font-size:2.5rem;margin-bottom:12px;">📋</div>
          <h3 style="margin-bottom:8px;">No tickets yet</h3>
          <p style="color:var(--text-muted);margin-bottom:20px;">Create your first ticket and it will appear here.</p>
          <a href="create-ticket.html" class="btn btn-primary" style="display:inline-flex;">+ Create Ticket</a>
         </div></td></tr>`
      : `<tr><td colspan="8"><div class="empty-state" style="padding:40px"><div class="empty-state-icon">🔍</div><h3>No tickets match your filters</h3><p>Try adjusting the search or filters above.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = tickets.map(t => {
    const title = t.title || t.subject || 'Untitled';
    const dept = t.department || t.dept || '—';
    const updated = window.relativeTime ? window.relativeTime(t.updatedAt || t.createdAt) : (t.updatedAt || t.createdAt ? new Date(t.updatedAt || t.createdAt).toLocaleDateString() : t.updated || '—');
    const meta = window.getTicketStatusMeta(t);
    const status = meta.status;
    const pri = (t.priority || 'medium').toLowerCase();
    const isResolved = meta.isResolved;
    const id = t.ticketId || t.id || t._id;
    const actionCell = isResolved
      ? `<span style="font-size:.75rem;color:var(--status-resolved-text);font-weight:600;display:inline-flex;align-items:center;gap:4px;">
           <svg viewBox="0 0 20 20" fill="none" style="width:12px;height:12px;"><path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
           Resolved
         </span>`
      : `<button class="btn btn-success btn-sm" onclick="markSolved('${id}',event)" title="Mark as solved" style="white-space:nowrap;">
           <svg viewBox="0 0 20 20" fill="none" style="width:11px;height:11px;"><path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
           Mark as Solved
         </button>`;
    return `
    <tr onclick="window.location.href='ticket-detail.html?id=${encodeURIComponent(t._id || t.id || t.ticketId)}'" style="cursor:pointer;">
      <td class="td-id">${id}</td>
      <td style="font-weight:500;max-width:220px;">${title}</td>
      <td><span class="badge badge-category">${t.category || 'General'}</span></td>
      <td><span class="badge badge-${pri}">${cap(pri)}</span></td>
      <td><span class="badge badge-${status}">${STATUS_MAP[status] || cap(status)}</span></td>
      <td style="font-size:.82rem;color:var(--text-secondary);">${dept}</td>
      <td style="font-size:.82rem;color:var(--text-muted);">${updated}</td>
      <td class="td-actions">${actionCell}</td>
    </tr>`;
  }).join('');
}

function resetFilters() {
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-priority').value = '';
  document.getElementById('filter-category').value = '';
  document.getElementById('search-input').value = '';
  filterAll();
}

async function markSolved(id, event) {
  if (event) event.stopPropagation();
  const ticket = currentTickets.find(t => (t.ticketId || t.id || t._id) === id);
  if (!ticket) { window.showToast?.('Ticket not found', 'error'); return; }
  try {
    await window.apiRequest(`/tickets/${encodeURIComponent(ticket._id)}/customer-resolve`, 'PATCH');
    window.showToast?.('🎉 Ticket marked as resolved!', 'success');
    await loadTickets();
  } catch (error) {
    window.showToast?.(error.message || 'Could not update ticket', 'error');
  }
}

async function loadTickets() {
  try {
    const data = await window.apiRequest('/tickets', 'GET');
    currentTickets = Array.isArray(data.tickets) ? data.tickets : [];
    updateNavBadge();
    filterAll();
  } catch (error) {
    window.showToast?.(error.message || 'Could not load tickets', 'error');
  }
}

function bindSocketUpdates() {
  const socket = window.initSocket();
  if (!socket) return;
  socket.off('ticket:statusChanged');
  socket.off('ticket:newReply');
  socket.on('ticket:statusChanged', () => loadTickets());
  socket.on('ticket:newReply', () => loadTickets());
}

window.addEventListener('storage', () => {
  loadTickets();
});
window.addEventListener('ticketsUpdated', loadTickets);
window.requireAuth?.(['customer']);
bindSocketUpdates();
initChatWidget();
loadTickets();
</script>
</body>
</html>
