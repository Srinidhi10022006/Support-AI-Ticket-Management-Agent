<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Queue – TicketPilot Agent</title>
  <meta name="description" content="Agent ticket queue — unassigned tickets and my active tickets with AI priority scoring." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <style>
    /* Filter bar advanced */
    .filter-bar-advanced {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
    }
    .filter-select {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: .8rem;
      color: var(--text-secondary);
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }
    .filter-select:focus { border-color: var(--accent); }
    .filter-sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

    /* Search bar wide */
    .search-wide {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 12px;
      flex: 1;
      min-width: 180px;
      transition: var(--transition);
    }
    .search-wide:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .search-wide svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .search-wide input { border: none; outline: none; background: transparent; font-size: .82rem; color: var(--text-primary); flex: 1; }

    /* Queue row card */
    .queue-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      transition: all .18s;
      cursor: pointer;
    }
    .queue-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .queue-row-main { min-width: 0; }
    .queue-row-subject { font-size: .875rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .queue-row-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .queue-row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .queue-row-time { font-size: .72rem; color: var(--text-muted); }
    .wait-time { font-size: .72rem; font-weight: 600; }
    .wait-urgent { color: #F87171; }
    .wait-warn   { color: #FBBF24; }
    .wait-ok     { color: #4ADE80; }

    /* Accept btn animation */
    .accept-btn { transition: all .15s !important; }
    .accept-btn.accepted { background: rgba(74,222,128,0.15) !important; border-color: rgba(74,222,128,0.4) !important; color: #4ADE80 !important; }

    /* My tickets sub-tabs */
    .sub-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .sub-tab {
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-size: .8rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .sub-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .sub-tab.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    /* SLA badge */
    .sla-badge-ok     { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(74,222,128,0.1); color: #4ADE80; border: 1px solid rgba(74,222,128,0.25); }
    .sla-badge-warn   { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(251,191,36,0.1); color: #FBBF24; border: 1px solid rgba(251,191,36,0.25); }
    .sla-badge-breach { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(239,68,68,0.1); color: #F87171; border: 1px solid rgba(239,68,68,0.25); animation: pulseFade 1.8s ease-in-out infinite; }
    @keyframes pulseFade { 0%,100%{opacity:1;} 50%{opacity:.5;} }

    /* Sentiment icons */
    .sent-pos { color: #4ADE80; }
    .sent-neu { color: #8B949E; }
    .sent-neg { color: #F87171; }

    @media (max-width: 680px) {
      .queue-row { grid-template-columns: 28px 1fr; }
      .queue-row-right { display: none; }
    }
  </style>
</head>

<script>
const currentUser = window.requireAuth(['agent', 'admin']);
if (!currentUser) {
  throw new Error('Unauthorized');
}

const PRIORITY_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
const SENT_ICON = { positive: '😊', neutral: '😐', negative: '😤' };
const SENT_CLASS = { positive: 'sent-pos', neutral: 'sent-neu', negative: 'sent-neg' };
const SLA_CLS = { ok: 'sla-badge-ok', warn: 'sla-badge-warn', breach: 'sla-badge-breach' };
const SLA_LABEL = { ok: 'On Track', warn: 'At Risk', breach: 'Breaching!' };
const STATUS_MAP = { open: 'Open', inprogress: 'In Progress', waiting: 'Waiting', resolved: 'Resolved', closed: 'Closed' };

let currentTab = 'unassigned';
let currentSubTab = 'inprogress';
let allTickets = [];

function cap(value) {
  const text = String(value || '').toLowerCase();
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function normalizePriority(value) {
  const p = String(value || '').toLowerCase();
  return ['critical', 'high', 'medium', 'low'].includes(p) ? p : 'medium';
}

function normalizeStatus(value) {
  const status = String(value || '').toLowerCase();
  if (status === 'in progress') return 'inprogress';
  if (status === 'waiting') return 'waiting';
  if (status === 'resolved') return 'resolved';
  if (status === 'closed') return 'closed';
  return status || 'open';
}

function formatSla(ticket) {
  if (ticket.slaBreached) return 'breach';
  if (!ticket.slaDeadline) return 'ok';
  const remaining = new Date(ticket.slaDeadline) - Date.now();
  if (remaining <= 0) return 'breach';
  if (remaining < 7200000) return 'warn';
  return 'ok';
}

function formatRelative(value) {
  return window.relativeTime ? window.relativeTime(value) : value;
}

function mapTicket(ticket) {
  const status = normalizeStatus(ticket.status);
  return {
    ...ticket,
    status,
    priority: normalizePriority(ticket.priority),
    displayId: ticket.ticketId || ticket._id || ticket.id,
    apiId: ticket._id || ticket.id,
    subject: ticket.title || 'Untitled ticket',
    cat: ticket.category || 'General',
    sentiment: String(ticket.sentiment || 'Neutral').toLowerCase(),
    sla: formatSla(ticket),
    createdAt: ticket.createdAt,
    updatedAt: ticket.updatedAt || ticket.createdAt,
  };
}

function isMine(ticket) {
  const agentId = ticket.assignedAgentId;
  return Boolean(agentId) && String(agentId) === String(currentUser.id || currentUser._id || '');
}

function getTicketAge(ticket) {
  return formatRelative(ticket.updatedAt || ticket.createdAt);
}

function getFilteredData(data) {
  const q = document.getElementById('search-input').value.toLowerCase();
  const fp = document.getElementById('filter-priority').value;
  const fc = document.getElementById('filter-category').value;
  const sort = document.getElementById('sort-select').value;

  let results = data.filter(ticket => {
    if (q && !ticket.displayId.toLowerCase().includes(q) && !ticket.subject.toLowerCase().includes(q)) return false;
    if (fp && ticket.priority !== fp) return false;
    if (fc && ticket.cat !== fc) return false;
    return true;
  });

  results.sort((a, b) => {
    if (sort === 'priority') return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
    if (sort === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
    if (sort === 'sla') return ['breach', 'warn', 'ok'].indexOf(a.sla) - ['breach', 'warn', 'ok'].indexOf(b.sla);
    return 0;
  });
  return results;
}

async function loadTickets() {
  try {
    const data = await window.apiRequest('/tickets?limit=100&sort=-createdAt', 'GET');
    allTickets = (data.tickets || []).map(mapTicket);
    updateStats();
    renderUnassigned();
    renderMine();
  } catch (error) {
    console.error(error);
    showToast(error.message || 'Could not load tickets', 'error');
  }
}

async function acceptTicket(id, btn) {
  const ticket = allTickets.find(item => item.apiId === id || item.displayId === id);
  if (!ticket) return;

  btn.classList.add('btn-loading');
  btn.disabled = true;
  try {
    await window.apiRequest(`/tickets/${ticket.apiId}/accept`, 'PATCH');
    await loadTickets();
    showToast(`Ticket ${ticket.displayId} assigned to you`, 'success');
  } catch (error) {
    btn.classList.remove('btn-loading');
    btn.disabled = false;
    showToast(error.message || 'Could not accept ticket', 'error');
  }
}

function updateStats() {
  const myOpen = allTickets.filter(ticket => isMine(ticket) && !['resolved', 'closed'].includes(ticket.status)).length;
  const unassigned = allTickets.filter(ticket => !ticket.assignedAgentId && !['resolved', 'closed'].includes(ticket.status)).length;
  const resolvedToday = allTickets.filter(ticket => ['resolved', 'closed'].includes(ticket.status) && ticket.resolvedAt && new Date(ticket.resolvedAt).toDateString() === new Date().toDateString()).length;
  const openEl = document.getElementById('stat-open');
  const unassEl = document.getElementById('stat-unassigned');
  const resolvedEl = document.getElementById('stat-resolved');
  if (openEl) openEl.textContent = myOpen;
  if (unassEl) unassEl.textContent = unassigned;
  if (resolvedEl) resolvedEl.textContent = resolvedToday;
  document.getElementById('tc-unassigned').textContent = unassigned;
  document.getElementById('tc-mine').textContent = myOpen;
  document.getElementById('sc-inprogress').textContent = allTickets.filter(ticket => isMine(ticket) && ticket.status === 'inprogress').length;
  document.getElementById('sc-resolved').textContent = allTickets.filter(ticket => isMine(ticket) && ticket.status === 'resolved').length;
  document.getElementById('sc-closed').textContent = allTickets.filter(ticket => isMine(ticket) && ticket.status === 'closed').length;
}

function switchTab(tab) {
  currentTab = tab;
  ['unassigned', 'mine'].forEach(item => {
    document.getElementById('tab-' + item).classList.toggle('active', item === tab);
    document.getElementById('panel-' + item).classList.toggle('active', item === tab);
  });
  applyFilters();
}

function switchSubTab(sub) {
  currentSubTab = sub;
  ['inprogress', 'resolved', 'closed'].forEach(item => {
    document.getElementById('subtab-' + item).classList.toggle('active', item === sub);
  });
  renderMine();
}

function applyFilters() {
  if (currentTab === 'unassigned') renderUnassigned();
  else renderMine();
}

function clearFilters() {
  document.getElementById('search-input').value = '';
  document.getElementById('filter-priority').value = '';
  document.getElementById('filter-category').value = '';
  document.getElementById('sort-select').value = 'priority';
  applyFilters();
}

function renderUnassigned() {
  const list = document.getElementById('unassigned-list');
  const tickets = getFilteredData(allTickets.filter(ticket => !ticket.assignedAgentId && !['resolved', 'closed'].includes(ticket.status)));

  if (!tickets.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="10" width="32" height="28" rx="4" stroke="var(--text-muted)" stroke-width="2" opacity=".4"/><path d="M18 20h12M18 28h8" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" opacity=".3"/></svg>
      </div>
      <h3>No tickets match your filters</h3>
      <p>Try adjusting the filters above or <button class="btn btn-ghost btn-sm" onclick="clearFilters()">clear all</button></p>
    </div>`;
    return;
  }

  list.innerHTML = tickets.map(ticket => `
    <div class="queue-row" onclick="location.href='agent-ticket-detail.html?id=${ticket.apiId}'">
      <div class="priority-radial ${ticket.priority}" title="Priority: ${cap(ticket.priority)}">${{ critical: '!!', high: '!', medium: '~', low: '—' }[ticket.priority]}</div>
      <div class="queue-row-main">
        <div class="queue-row-subject" title="${ticket.subject}">${ticket.subject}</div>
        <div class="queue-row-meta">
          <span class="td-id">${ticket.displayId}</span>
          <span class="badge badge-category">${ticket.cat}</span>
          <span class="badge badge-${ticket.priority}">${cap(ticket.priority)}</span>
          <span class="${SENT_CLASS[ticket.sentiment] || 'sent-neu'}" title="Sentiment: ${ticket.sentiment}">${SENT_ICON[ticket.sentiment] || '😐'}</span>
          <span class="${SLA_CLS[ticket.sla] || 'sla-badge-ok'}">${SLA_LABEL[ticket.sla] || 'On Track'}</span>
        </div>
      </div>
      <div class="queue-row-right">
        <span class="wait-time ${ticket.sla === 'breach' ? 'wait-urgent' : ticket.sla === 'warn' ? 'wait-warn' : 'wait-ok'}">⏱ ${ticket.sla === 'breach' ? 'Over SLA' : ticket.sla === 'warn' ? 'At risk' : 'Healthy'}</span>
        <div style="display:flex;gap:6px;" onclick="event.stopPropagation()">
          <button class="btn btn-primary btn-sm accept-btn" id="acc-${ticket.displayId}" onclick="acceptTicket('${ticket.apiId}',this)">Accept</button>
          <a href="agent-ticket-detail.html?id=${ticket.apiId}" class="btn btn-ghost btn-sm">View</a>
        </div>
      </div>
    </div>`).join('');
}

function renderMine() {
  const list = document.getElementById('mine-list');
  let filtered = allTickets.filter(ticket => isMine(ticket) && ticket.status === currentSubTab);
  filtered = getFilteredData(filtered);

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="var(--text-muted)" stroke-width="2" opacity=".4"/><path d="M16 24l5.5 5.5 12-12" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/></svg>
      </div>
      <h3>${currentSubTab === 'inprogress' ? 'No tickets in progress' : currentSubTab === 'resolved' ? 'No resolved tickets' : 'No closed tickets'}</h3>
      <p>${currentSubTab === 'inprogress' ? 'Accept a ticket from the Unassigned tab to get started.' : 'Resolved tickets will appear here.'}</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(ticket => `
    <div class="queue-row" onclick="location.href='agent-ticket-detail.html?id=${ticket.apiId}'">
      <div class="priority-radial ${ticket.priority}" title="Priority: ${cap(ticket.priority)}">${{ critical: '!!', high: '!', medium: '~', low: '—' }[ticket.priority]}</div>
      <div class="queue-row-main">
        <div class="queue-row-subject" title="${ticket.subject}">${ticket.subject}</div>
        <div class="queue-row-meta">
          <span class="td-id">${ticket.displayId}</span>
          <span class="badge badge-category">${ticket.cat}</span>
          <span class="badge badge-${ticket.priority}">${cap(ticket.priority)}</span>
          <span class="badge badge-${ticket.status}">${STATUS_MAP[ticket.status] || cap(ticket.status)}</span>
          <span class="${SENT_CLASS[ticket.sentiment] || 'sent-neu'}" title="Sentiment">${SENT_ICON[ticket.sentiment] || '😐'}</span>
          ${ticket.status === 'inprogress' ? `<span class="${SLA_CLS[ticket.sla] || 'sla-badge-ok'}">${SLA_LABEL[ticket.sla] || 'On Track'}</span>` : ''}
        </div>
      </div>
      <div class="queue-row-right">
        <span class="queue-row-time">Updated ${getTicketAge(ticket)}</span>
        <div style="display:flex;gap:6px;" onclick="event.stopPropagation()">
          <a href="agent-ticket-detail.html?id=${ticket.apiId}" class="btn btn-ghost btn-sm">Open Workspace</a>
        </div>
      </div>
    </div>`).join('');
}

if (location.hash === '#my') switchTab('mine');

const socket = window.initSocket();
if (socket) {
  socket.on('ticket:created', loadTickets);
  socket.on('ticket:statusChanged', loadTickets);
  socket.on('ticket:newReply', loadTickets);
}

window.addEventListener('focus', loadTickets);

initCommandPalette();
loadTickets();
</script>
</body>
</html>
